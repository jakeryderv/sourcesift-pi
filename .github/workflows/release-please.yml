name: Prepare release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Require successful CI on current main
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(git rev-parse HEAD)
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$main_sha" --limit 1 --json conclusion --jq '.[0].conclusion')
          if [[ "$result" == success ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Current main has no passing push CI; wait for its completion.'
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.ready.outputs.ready == 'true'
        with:
          target-branch: main
